name: Publish JS package

# Runs only when a tag like js-v0.16.1 is pushed. No NPM_TOKEN: npm trusted
# publishing (OIDC) authenticates, and provenance is attached.
on:
  push:
    tags:
      - "js-v*"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: js
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false
      - run: npm test

  publish:
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: npm
      url: https://www.npmjs.com/package/mobs-ws
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: js
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false
      - name: Use an npm CLI with trusted publishing (>= 11.5.1)
        run: npm install -g npm@latest && npm --version
      - name: Tag must match package.json version
        id: version
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "${GITHUB_REF_NAME}" != "js-v${version}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match js/package.json version ${version}" >&2
            exit 1
          fi
          if npm view "mobs-ws@${version}" version >/dev/null 2>&1; then
            echo "mobs-ws@${version} is already on npm; nothing to publish."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish
        if: steps.version.outputs.skip != 'true'
        run: npm publish --provenance --access public
