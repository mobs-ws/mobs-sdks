name: Publish Python package

# Runs only when a tag like python-v0.16.1 is pushed. No stored secrets:
# PyPI Trusted Publishing (OIDC) mints a short-lived upload token.
on:
  push:
    tags:
      - "python-v*"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install ./python pytest
      - run: python -m pytest -q python/tests

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Tag must match pyproject version
        run: |
          version=$(python -c "import tomllib; print(tomllib.load(open('python/pyproject.toml','rb'))['project']['version'])")
          if [ "${GITHUB_REF_NAME}" != "python-v${version}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match python/pyproject.toml version ${version}" >&2
            exit 1
          fi
      - run: python -m pip install build
      - run: python -m build python --outdir dist
      - uses: actions/upload-artifact@v7
        with:
          name: python-dist
          path: dist/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/mobs-ws/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: python-dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
